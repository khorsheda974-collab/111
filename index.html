<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Multi-Platform Bot Demo</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #f0f2f5; padding: 15px; color: #333; }
    .header { background: #1877f2; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
    .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h3 { margin-bottom: 10px; color: #1877f2; }
    input, button, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #1877f2; color: white; border: none; font-weight: bold; cursor: pointer; }
    .chat-box { height: 250px; overflow-y: auto; border: 1px solid #eee; padding: 10px; background: #fafafa; border-radius: 5px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 15px; font-size: 14px; }
    .user { background: #0084ff; color: white; align-self: flex-end; }
    .bot { background: #e4e6eb; color: black; align-self: flex-start; }
    .img-preview { max-width: 100px; max-height: 100px; border-radius: 5px; margin-top: 5px; display: block; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🛍️ AI Product Vision Auto-Reply Bot</h2>
    <p>Facebook, WhatsApp, TikTok & Imo Demo</p>
  </div>

  <!-- Product Catalog -->
  <div class="card">
    <h3>১. প্রোডাক্ট আপলোড (ক্যাটালগ)</h3>
    <input type="text" id="pName" placeholder="প্রোডাক্টের নাম (যেমন: Red Silk Saree)">
    <input type="text" id="pPrice" placeholder="দাম (যেমন: ১২০০ টাকা)">
    <input type="text" id="pStock" placeholder="স্টক ও কালার (যেমন: লাল কালার ৫ পিস আছে)">
    <button onclick="saveProduct()">প্রোডাক্ট সেভ করুন</button>
    <div id="status" style="font-size:12px; color:green;"></div>
  </div>

  <!-- Live Chat Test -->
  <div class="card">
    <h3>২. কাস্টমার চ্যাট ও ফটো স্ক্যান সিমুলেটর</h3>
    <select id="platform">
      <option>Facebook Messenger</option>
      <option>WhatsApp Business</option>
      <option>TikTok Inbox</option>
      <option>IMO Inbox</option>
    </select>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">হ্যালো! যেকোনো প্রোডাক্টের ছবি বা স্ক্রিনশট পাঠান, আমি স্টক ও দাম জানিয়ে দেব।</div>
    </div>

    <label style="font-size:12px; font-weight:bold;">প্রোডাক্টের ছবি নির্বাচন করুন (SS/Photo):</label>
    <input type="file" id="imgInput" accept="image/*" onchange="previewFile()">
    <input type="text" id="userMsg" placeholder="মেসেজ লিখুন (যেমন: এটার দাম কত?)...">
    <button onclick="sendMsg()">মেসেজ ও ছবি পাঠান</button>
  </div>

  <script>
    let savedProduct = null;
    let selectedImageSrc = null;

    function saveProduct() {
      const name = document.getElementById('pName').value;
      const price = document.getElementById('pPrice').value;
      const stock = document.getElementById('pStock').value;
      if(!name || !price) { alert("দয়া করে নাম ও দাম লিখুন"); return; }
      savedProduct = { name, price, stock };
      document.getElementById('status').innerText = "✅ ক্যাটালগে প্রোডাক্ট সেভ হয়েছে!";
    }

    function previewFile() {
      const file = document.getElementById('imgInput').files[0];
      const reader = new FileReader();
      reader.onloadend = function () {
        selectedImageSrc = reader.result;
      }
      if (file) reader.readAsDataURL(file);
    }

    function sendMsg() {
      const msg = document.getElementById('userMsg').value;
      const chatBox = document.getElementById('chatBox');
      const platform = document.getElementById('platform').value;

      if (!msg && !selectedImageSrc) return;

      // User Message
      let userHtml = `<div class="msg user"><b>[${platform}]</b><br>${msg}`;
      if(selectedImageSrc) {
        userHtml += `<br><img src="${selectedImageSrc}" class="img-preview">`;
      }
      userHtml += `</div>`;
      chatBox.innerHTML += userHtml;

      // Bot Response Simulation
      setTimeout(() => {
        let botReply = "";
        if (selectedImageSrc) {
          if (savedProduct) {
            botReply = `🤖 <b>AI Vision Detected:</b> আমি ছবিটি অ্যানালাইস করে আপনার প্রোডাক্টটি চিনে ফেলেছি!<br><br><b>প্রোডাক্ট:</b> ${savedProduct.name}<br><b>দাম:</b> ${savedProduct.price}<br><b>স্টক বিবরণ:</b> ${savedProduct.stock}<br><br>আপনি কি এটি অর্ডার করতে চান?`;
          } else {
            botReply = `🤖 <b>AI Vision Detected:</b> আমি ছবিটি পেয়েছি, তবে এটি ক্যাটালগের কোনো প্রোডাক্টের সাথে মিলছে না। অনুগ্রহ করে প্রথমে ১ নম্বর সেকশন থেকে ক্যাটালগে প্রোডাক্ট আপলোড করুন।`;
          }
        } else {
          botReply = `🤖 আমাদের যেকোনো প্রোডাক্টের ছবি বা ভিডিও স্ক্রিনশট পাঠালে আমি সাথে সাথে দাম ও স্টক জানিয়ে দেব।`;
        }
        chatBox.innerHTML += `<div class="msg bot">${botReply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 1000);

      // Reset
      document.getElementById('userMsg').value = '';
      document.getElementById('imgInput').value = '';
      selectedImageSrc = null;
    }
  </script>
</body>
</html>
